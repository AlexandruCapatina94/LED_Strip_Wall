[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct, send_on_enter
lib_deps = fastled/FastLED@^3.5.0
; Use C++17 for constexpr lambda support
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<main.cpp>

[env:esp32-c3-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = fastled/FastLED@^3.5.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
build_src_filter =
    +<main.cpp>
upload_protocol = espota
upload_port = 192.168.0.148

[env:esp32-c3-debug-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = fastled/FastLED@^3.5.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
build_src_filter =
    +<debug_first_strip.cpp>
upload_protocol = espota
upload_port = 192.168.0.148

[env:esp32-c3-debug]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct, send_on_enter
; Stop auto-reset loops
monitor_dtr = 0
monitor_rts = 0
; show what I type
monitor_flags = --echo
monitor_eol = CRLF
lib_deps = fastled/FastLED@^3.5.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<debug_first_strip.cpp>
